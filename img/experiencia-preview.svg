<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#00000000"/>
  
  <!-- Background Elements -->
  <g opacity="0.3">
    <path d="M100,300 Q400,50 700,300 T700,500" stroke="#2ec4b6" stroke-width="10" fill="none"/>
    <path d="M50,400 Q300,200 550,400 T750,500" stroke="#e5ca10" stroke-width="8" fill="none"/>
    <circle cx="200" cy="150" r="50" fill="#2ec4b64d"/>
    <circle cx="600" cy="450" r="70" fill="#e5ca104d"/>
  </g>
  
  <!-- Main Experience Cards -->
  <g>
    <!-- Developer Card -->
    <rect x="80" y="100" width="300" height="200" rx="15" fill="white" stroke="#2ec4b6" stroke-width="5"/>
    <text x="100" y="140" font-family="Montserrat, sans-serif" font-size="24" font-weight="bold" fill="#3b2f2f">Desarrollador de Software</text>
    <line x1="100" y1="160" x2="150" y2="160" stroke="#e5ca10" stroke-width="4"/>
    <text x="100" y="190" font-family="Montserrat, sans-serif" font-size="16" fill="#3b2f2f">Frontend y Backend</text>
    <text x="100" y="220" font-family="Montserrat, sans-serif" font-size="16" fill="#3b2f2f">Tecnologías modernas</text>
    <text x="100" y="250" font-family="Montserrat, sans-serif" font-size="16" fill="#3b2f2f">Desarrollo de soluciones</text>
    
    <!-- Teacher Card -->
    <rect x="420" y="100" width="300" height="180" rx="15" fill="white" stroke="#e5ca10" stroke-width="5"/>
    <text x="440" y="140" font-family="Montserrat, sans-serif" font-size="24" font-weight="bold" fill="#3b2f2f">Profesor de Programación</text>
    <line x1="440" y1="160" x2="490" y2="160" stroke="#2ec4b6" stroke-width="4"/>
    <text x="440" y="190" font-family="Montserrat, sans-serif" font-size="16" fill="#3b2f2f">Python y desarrollo web</text>
    <text x="440" y="220" font-family="Montserrat, sans-serif" font-size="16" fill="#3b2f2f">Formación a estudiantes</text>
  </g>
  
  <!-- Small Experience Cards -->
  <g>
    <rect x="80" y="330" width="200" height="150" rx="15" fill="white" stroke="#ff9f1c" stroke-width="5"/>
    <text x="100" y="370" font-family="Montserrat, sans-serif" font-size="20" font-weight="bold" fill="#3b2f2f">Orador</text>
    <line x1="100" y1="385" x2="130" y2="385" stroke="#e5ca10" stroke-width="3"/>
    <text x="100" y="410" font-family="Montserrat, sans-serif" font-size="14" fill="#3b2f2f">Conferencias sobre IA</text>
    
    <rect x="300" y="330" width="200" height="150" rx="15" fill="white" stroke="#4a4e69" stroke-width="5"/>
    <text x="320" y="370" font-family="Montserrat, sans-serif" font-size="20" font-weight="bold" fill="#3b2f2f">Atención</text>
    <line x1="320" y1="385" x2="350" y2="385" stroke="#e5ca10" stroke-width="3"/>
    <text x="320" y="410" font-family="Montserrat, sans-serif" font-size="14" fill="#3b2f2f">Soporte técnico</text>
    
    <rect x="520" y="330" width="200" height="150" rx="15" fill="white" stroke="#4a4e69" stroke-width="5"/>
    <text x="540" y="370" font-family="Montserrat, sans-serif" font-size="20" font-weight="bold" fill="#3b2f2f">Operador</text>
    <line x1="540" y1="385" x2="570" y2="385" stroke="#e5ca10" stroke-width="3"/>
    <text x="540" y="410" font-family="Montserrat, sans-serif" font-size="14" fill="#3b2f2f">Mantenimiento de sistemas</text>
  </g>
</svg>
