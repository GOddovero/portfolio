<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Background -->
  <rect width="200" height="150" fill="#FF6B35" rx="15"/>
  
  <!-- GOH Text -->
  <text x="100" y="40" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#F4D03F" stroke="#3b2f2f" stroke-width="2">GOH</text>
  
  <!-- GYM Text -->
  <text x="100" y="75" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#F4D03F" stroke="#3b2f2f" stroke-width="2">GYM</text>
  
  <!-- Barbell Left -->
  <rect x="30" y="95" width="8" height="25" fill="#3b2f2f" rx="4"/>
  <rect x="25" y="90" width="18" height="8" fill="#3b2f2f" rx="4"/>
  <rect x="25" y="117" width="18" height="8" fill="#3b2f2f" rx="4"/>
  
  <!-- Barbell Center -->
  <rect x="43" y="105" width="114" height="5" fill="#3b2f2f"/>
  
  <!-- Barbell Right -->
  <rect x="162" y="95" width="8" height="25" fill="#3b2f2f" rx="4"/>
  <rect x="157" y="90" width="18" height="8" fill="#3b2f2f" rx="4"/>
  <rect x="157" y="117" width="18" height="8" fill="#3b2f2f" rx="4"/>
  
  <!-- Weight Plates Left -->
  <circle cx="65" cy="107" r="12" fill="#3b2f2f"/>
  <circle cx="85" cy="107" r="10" fill="#3b2f2f"/>
  
  <!-- Weight Plates Right -->
  <circle cx="135" cy="107" r="12" fill="#3b2f2f"/>
  <circle cx="115" cy="107" r="10" fill="#3b2f2f"/>
