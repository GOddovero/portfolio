            padding: 0;

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .gif-container {
            margin-bottom: 30px;
        }

        .gif-container img {
            max-width: 300px;
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .message {
            font-size: 18px;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 500;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .social-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background-color: #e5ca10;
            border: 5px solid #3b2f2f;
            border-radius: 25%;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .social-button svg {
            width: 48px;
            height: 48px;
            fill: #3b2f2f;
        }

        /* Animación sutil */
        .container {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            .logo {
                max-width: 150px;
            }

            .gif-container img {
                max-width: 250px;
            }

            .message {
                font-size: 16px;
            }

            .social-button {
                width: 56px;
                height: 56px;
                border: 4px solid #3b2f2f;
            }

            .social-button svg {
                width: 40px;
                height: 40px;
            }
        }

        /* Botones flotantes */
        .floating-buttons-container {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-left: 15px;
        }

        .floating-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 280px;
            height: 70px;
            background: white;
            border-radius: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid #e0e0e0;
            padding: 10px 15px;
            gap: 15px;
        }

        .floating-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            border-color: #FF6B35;
        }

        .floating-button:hover .floating-button-arrow {
            transform: translateX(5px);
            color: #FF6B35;
        }

        .floating-button-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .floating-button-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .floating-button-text {
            font-size: 14px;
            font-weight: 600;
            color: #3b2f2f;
            line-height: 1.3;
            text-align: left;
        }

        .floating-button-arrow {
            font-size: 18px;
            color: #3b2f2f;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        /* Posicionamiento relativo al contenedor */
        @media (min-width: 1024px) {
            .floating-buttons-container {
                position: absolute;
                right: auto;
                left: calc(50% + 250px + 15px);
                top: 50%;
                transform: translateY(-50%);
            }
        }

        /* Responsivo para los botones flotantes */
        @media (max-width: 1023px) {
            .floating-buttons-container {
                right: 15px;
                top: auto;
                bottom: 20px;
                transform: none;
                margin-left: 0;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;

                width: 200px;
                height: 60px;
                padding: 8px 12px;
                gap: 10px;

            }
        }

                gap: 8px;

                width: 60px;
                height: 60px;
                padding: 6px;
                gap: 0;
                justify-content: center;
            }

            .floating-button-content {
                gap: 0;
            }

            .floating-button-text {
                display: none;
            }

            .floating-button-arrow {
                display: none;
            }

            .floating-button-logo {
                width: 48px;
                height: 48px;
                margin: 0 auto;
